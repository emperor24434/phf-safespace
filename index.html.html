<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHF SafeSpace - UNIOSUN Wellbeing Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 font-sans text-slate-800 antialiased min-h-screen flex justify-center items-center">
    <div id="root" class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl flex flex-col relative overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext } = React;

        const SUPABASE_URL = "https://hlaunuemwiemqktablby.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Bdd6Zs7wLyipbVjn1Htdog_k2WJpZ7n";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const AuthContext = createContext({});

        const AuthProvider = ({ children }) => {
            const [user, setUser] = useState(null);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    if (session?.user) handleUserSession(session.user);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    if (session?.user) handleUserSession(session.user);
                    else setUser(null);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleUserSession = (authUser) => {
                // AUTHORIZED ADMIN EMAILS
                const adminEmails = [
                    'miftaudeenogunremi@gmail.com',
                    'ogunremilolade2023@gmail.com'
                ];
                const isAdmin = authUser.email && adminEmails.includes(authUser.email.toLowerCase());
                
                setUser({
                    id: authUser.id,
                    email: authUser.email,
                    full_name: authUser.user_metadata?.full_name || authUser.email,
                    role: isAdmin ? 'admin' : 'student'
                });
            };

            const login = async (email, password) => {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) { alert("Login failed: " + error.message); return null; }
                if (data?.user) handleUserSession(data.user);
                return data;
            };

            const register = async (email, password, fullName) => {
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email, password, options: { data: { full_name: fullName } }
                });
                if (authError) { alert("Error signing up: " + authError.message); return null; }

                if (authData.user) {
                    handleUserSession(authData.user);
                }
                alert("Account created successfully!");
                return authData;
            };

            const logout = async () => {
                await supabase.auth.signOut();
                setUser(null);
            };

            return (
                <AuthContext.Provider value={{ user, login, register, logout }}>
                    {children}
                </AuthContext.Provider>
            );
        };

        const App = () => {
            const { user } = useContext(AuthContext);
            const [activeTab, setActiveTab] = useState('home');
            const [subScreen, setSubScreen] = useState(null);

            if (!user) return <AuthScreen />;

            const renderContent = () => {
                if (subScreen === 'wellbeing') return <WellbeingHubScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'community') return <CommunityScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'herspace') return <HerSpaceScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'support') return <SupportScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'growth') return <GrowthScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'events') return <EventsScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'campus') return <CampusConnectScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'resources') return <ResourcesScreen onBack={() => setSubScreen(null)} user={user} />;
                if (subScreen === 'profile') return <ProfileScreen user={user} onBack={() => setSubScreen(null)} />;

                switch(activeTab) {
                    case 'home': return <HomeScreen user={user} setSubScreen={setSubScreen} />;
                    case 'explore': return <ExploreScreen setSubScreen={setSubScreen} />;
                    case 'saved': return <SavedScreen />;
                    case 'messages': return <MessagesScreen />;
                    case 'profile': return <ProfileScreen user={user} />;
                    default: return <HomeScreen user={user} setSubScreen={setSubScreen} />;
                }
            };

            return (
                <div className="flex flex-col h-screen bg-slate-50 text-slate-800 relative">
                    <header className="bg-[#0b4638] text-white px-5 pt-4 pb-8 shadow-sm">
                        <div className="flex justify-between items-center mb-3">
                            <div className="flex items-center space-x-2">
                                <div className="w-8 h-8 rounded-full border border-emerald-400 flex items-center justify-center font-bold text-xs bg-[#073327]">PHF</div>
                                <h1 className="font-bold text-lg tracking-tight">PHF SafeSpace</h1>
                            </div>
                            <div className="flex items-center space-x-3">
                                <div onClick={() => setSubScreen('profile')} className="w-8 h-8 rounded-full overflow-hidden border border-emerald-400 cursor-pointer bg-emerald-800 flex items-center justify-center text-xs font-bold">
                                    {(user.full_name || user.email).charAt(0).toUpperCase()}
                                </div>
                            </div>
                        </div>
                        {!subScreen && activeTab === 'home' && (
                            <div>
                                <h2 className="text-xl font-bold">Welcome back, {user.full_name ? user.full_name.split(' ')[0] : 'Student'}! 👋</h2>
                                <p className="text-xs text-emerald-100 mt-0.5">Your space to connect, grow and find support.</p>
                            </div>
                        )}
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 space-y-4 pb-24 -mt-4 bg-slate-50 rounded-t-2xl z-10">
                        {renderContent()}
                    </main>

                    <nav className="bg-white border-t border-slate-200 flex justify-around py-2.5 absolute bottom-0 w-full shadow-lg z-20">
                        <BottomNavItem label="Home" icon="🏠" active={!subScreen && activeTab === 'home'} onClick={() => { setSubScreen(null); setActiveTab('home'); }} />
                        <BottomNavItem label="Explore" icon="🧭" active={!subScreen && activeTab === 'explore'} onClick={() => { setSubScreen(null); setActiveTab('explore'); }} />
                        <BottomNavItem label="Saved" icon="🔖" active={!subScreen && activeTab === 'saved'} onClick={() => { setSubScreen(null); setActiveTab('saved'); }} />
                        <BottomNavItem label="Messages" icon="💬" active={!subScreen && activeTab === 'messages'} onClick={() => { setSubScreen(null); setActiveTab('messages'); }} />
                        <BottomNavItem label="Profile" icon="👤" active={subScreen === 'profile' || (!subScreen && activeTab === 'profile')} onClick={() => { setSubScreen(null); setActiveTab('profile'); }} />
                    </nav>
                </div>
            );
        };

        const BottomNavItem = ({ label, icon, active, onClick }) => (
            <button onClick={onClick} className={`text-[10px] font-medium flex flex-col items-center px-3 py-1 ${active ? 'text-[#0b4638] font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
                <span className="text-base mb-0.5">{icon}</span>
                <span>{label}</span>
            </button>
        );

        const AuthScreen = () => {
            const { login, register } = useContext(AuthContext);
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [fullName, setFullName] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                isLogin ? login(email, password) : register(email, password, fullName);
            };

            return (
                <div className="flex flex-col justify-center items-center h-full p-6 bg-[#0b4638] text-white w-full">
                    <div className="w-16 h-16 rounded-2xl bg-emerald-600/30 border border-emerald-400/30 flex items-center justify-center text-2xl font-bold mb-3 shadow-inner">🌿</div>
                    <h2 className="text-2xl font-bold mb-1 text-emerald-200">PHF SafeSpace</h2>
                    <p className="text-xs text-emerald-300/80 mb-6 text-center">Peace Health Foundation • UNIOSUN Portal</p>
                    <form onSubmit={handleSubmit} className="w-full space-y-3.5">
                        {!isLogin && (
                            <input type="text" placeholder="Full Name" value={fullName} onChange={e => setFullName(e.target.value)} className="w-full p-3 bg-[#073327] rounded-xl border border-emerald-700/50 text-sm placeholder-emerald-300/50 text-white focus:outline-none focus:border-emerald-400" required />
                        )}
                        <input type="email" placeholder="UNIOSUN Email Address" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-3 bg-[#073327] rounded-xl border border-emerald-700/50 text-sm placeholder-emerald-300/50 text-white focus:outline-none focus:border-emerald-400" required />
                        <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-[#073327] rounded-xl border border-emerald-700/50 text-sm placeholder-emerald-300/50 text-white focus:outline-none focus:border-emerald-400" required />
                        <button type="submit" className="w-full bg-emerald-500 text-[#073327] p-3 rounded-xl font-bold hover:bg-emerald-400 transition text-sm shadow-md">
                            {isLogin ? 'Login to SafeSpace' : 'Create Student Account'}
                        </button>
                    </form>
                    <button onClick={() => setIsLogin(!isLogin)} className="mt-4 text-xs text-emerald-200 underline hover:text-white">
                        {isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login"}
                    </button>
                </div>
            );
        };

        const HomeScreen = ({ user, setSubScreen }) => (
            <div className="space-y-4">
                <div className="relative">
                    <span className="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">🔍</span>
                    <input type="text" placeholder="What are you looking for today?" className="w-full pl-10 pr-4 py-3 bg-white rounded-2xl border border-slate-200 text-xs shadow-sm focus:outline-none focus:border-emerald-600" />
                </div>
                <div className="space-y-2">
                    <h3 className="text-[11px] font-bold text-slate-400 tracking-wider uppercase px-1">Explore Safespace</h3>
                    <div className="grid grid-cols-4 gap-2.5">
                        <FeatureCard title="Wellbeing Hub" icon="📖" color="bg-emerald-50 text-emerald-700" onClick={() => setSubScreen('wellbeing')} />
                        <FeatureCard title="Student Community" icon="💬" color="bg-sky-50 text-sky-700" onClick={() => setSubScreen('community')} />
                        <FeatureCard title="HerSpace" icon="🌸" color="bg-pink-50 text-pink-700" onClick={() => setSubScreen('herspace')} />
                        <FeatureCard title="Events & Webinars" icon="📅" color="bg-indigo-50 text-indigo-700" onClick={() => setSubScreen('events')} />
                        <FeatureCard title="Find Support" icon="🤝" color="bg-teal-50 text-teal-700" onClick={() => setSubScreen('support')} />
                        <FeatureCard title="Growth & Opps" icon="🚀" color="bg-amber-50 text-amber-700" onClick={() => setSubScreen('growth')} />
                        <FeatureCard title="Campus Connect" icon="🏛️" color="bg-blue-50 text-blue-700" onClick={() => setSubScreen('campus')} />
                        <FeatureCard title="Resources" icon="📚" color="bg-violet-50 text-violet-700" onClick={() => setSubScreen('resources')} />
                    </div>
                </div>
            </div>
        );

        const FeatureCard = ({ title, icon, color, onClick }) => (
            <button onClick={onClick} className="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center text-center hover:shadow transition group">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-lg mb-2 group-hover:scale-105 transition ${color}`}>{icon}</div>
                <span className="text-[10px] font-bold text-slate-700 leading-tight">{title}</span>
            </button>
        );

        const ExploreScreen = ({ setSubScreen }) => (
            <div className="space-y-3">
                <h3 className="font-bold text-sm text-slate-800 px-1">Explore All 10 Modules</h3>
                <div className="space-y-2">
                    <ModuleRow title="Wellbeing Hub" desc="Mental health, stress relief & self-care guides" icon="📖" onClick={() => setSubScreen('wellbeing')} />
                    <ModuleRow title="Student Community" desc="Anonymous peer support & discussions" icon="💬" onClick={() => setSubScreen('community')} />
                    <ModuleRow title="HerSpace" desc="Women's circles, wellness & mentorship" icon="🌸" onClick={() => setSubScreen('herspace')} />
                    <ModuleRow title="Find Support" desc="Verified campus and crisis hotlines" icon="🤝" onClick={() => setSubScreen('support')} />
                    <ModuleRow title="Growth & Opportunities" desc="Scholarships, internships & fellowships" icon="🚀" onClick={() => setSubScreen('growth')} />
                    <ModuleRow title="Events & Webinars" desc="Masterclasses and live workshops" icon="📅" onClick={() => setSubScreen('events')} />
                    <ModuleRow title="Campus Connect" desc="UNIOSUN announcements & resources" icon="🏛️" onClick={() => setSubScreen('campus')} />
                    <ModuleRow title="Resource Library" desc="Semester workbooks and toolkits" icon="📚" onClick={() => setSubScreen('resources')} />
                </div>
            </div>
        );

        const ModuleRow = ({ title, desc, icon, onClick }) => (
            <div onClick={onClick} className="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between cursor-pointer hover:bg-slate-50 transition">
                <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-lg">{icon}</div>
                    <div>
                        <h4 className="font-bold text-xs text-slate-800">{title}</h4>
                        <p className="text-[11px] text-slate-500">{desc}</p>
                    </div>
                </div>
                <span className="text-slate-400 font-bold">›</span>
            </div>
        );

        const SavedScreen = () => <div className="space-y-3"><h3 className="font-bold text-sm text-slate-800 px-1">Saved Bookmarks</h3><div className="bg-white p-4 rounded-2xl border text-center py-8 text-xs text-slate-400">No saved bookmarks yet.</div></div>;
        const MessagesScreen = () => <div className="space-y-3"><h3 className="font-bold text-sm text-slate-800 px-1">Messages & Support Chats</h3><div className="bg-white p-4 rounded-2xl border text-center py-8 text-xs text-slate-400">No active conversations.</div></div>;

        // 1. WELLBEING HUB MODULE
        const WellbeingHubScreen = ({ onBack, user }) => {
            const [items, setItems] = useState([
                { id: 1, title: 'Managing Exam Stress', category: 'Stress Relief', read_time: '5 min', link: 'https://example.com/exam-stress' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [title, setTitle] = useState('');
            const [category, setCategory] = useState('');
            const [readTime, setReadTime] = useState('');
            const [link, setLink] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!title) return;
                setItems([{ id: Date.now(), title, category: category || 'General', read_time: readTime || '5 min', link: link || '#' }, ...items]);
                setTitle(''); setCategory(''); setReadTime(''); setLink(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Wellbeing Hub 🌿</h3>
                                <p className="text-xs text-slate-500">Mental health and self-care resources.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Add Resource</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-emerald-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-emerald-900">Upload Wellbeing Guide</h4>
                                <input type="text" placeholder="Resource Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <input type="text" placeholder="Category (e.g. Stress Relief)" value={category} onChange={e => setCategory(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="text" placeholder="Read Time (e.g. 5 min)" value={readTime} onChange={e => setReadTime(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="url" placeholder="Resource Link / URL" value={link} onChange={e => setLink(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-[#0b4638] text-white p-2 rounded-lg text-xs font-bold">Publish Guide</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {items.map(item => (
                                <div key={item.id} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-slate-800">{item.title}</p>
                                        <p className="text-slate-500 text-[10px]">{item.category} • {item.read_time}</p>
                                    </div>
                                    <a href={item.link} target="_blank" rel="noreferrer" className="text-emerald-700 font-bold underline">Open</a>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 2. STUDENT COMMUNITY MODULE
        const CommunityScreen = ({ onBack, user }) => {
            const [posts, setPosts] = useState([
                { id: 1, author: 'Anonymous Student', content: 'Anyone studying around College of Health Sciences library tonight?', tag: 'Academics' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [content, setContent] = useState('');
            const [tag, setTag] = useState('');

            const handlePost = (e) => {
                e.preventDefault();
                if(!content) return;
                setPosts([{ id: Date.now(), author: 'Anonymous Student', content, tag: tag || 'General' }, ...posts]);
                setContent(''); setTag(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Student Community 💬</h3>
                                <p className="text-xs text-slate-500">Anonymous peer discussions.</p>
                            </div>
                            <button onClick={() => setShowForm(!showForm)} className="bg-sky-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ New Post</button>
                        </div>
                        {showForm && (
                            <form onSubmit={handlePost} className="bg-sky-50 p-3 rounded-xl border space-y-2">
                                <textarea placeholder="Share your thought anonymously..." value={content} onChange={e => setContent(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" rows="3" required></textarea>
                                <input type="text" placeholder="Tag (e.g. Wellbeing, Academics)" value={tag} onChange={e => setTag(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-sky-700 text-white p-2 rounded-lg text-xs font-bold">Post Anonymously</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {posts.map(p => (
                                <div key={p.id} className="p-3 bg-slate-50 rounded-xl border space-y-1">
                                    <div className="flex justify-between text-[10px] text-slate-400">
                                        <span>{p.author}</span>
                                        <span className="bg-sky-100 text-sky-700 px-2 py-0.5 rounded-full font-bold">{p.tag}</span>
                                    </div>
                                    <p className="text-slate-800">{p.content}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. HERSPACE MODULE
        const HerSpaceScreen = ({ onBack, user }) => {
            const [circles, setCircles] = useState([
                { id: 1, title: 'Women in Leadership & Wellness Circle', date: 'Every Thursday, 4 PM', link: 'https://example.com/herspace' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [link, setLink] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!title) return;
                setCircles([{ id: Date.now(), title, date: date || 'TBA', link: link || '#' }, ...circles]);
                setTitle(''); setDate(''); setLink(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">HerSpace 🌸</h3>
                                <p className="text-xs text-slate-500">Safe discussions, wellness circles & mentorship.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-pink-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Add Circle</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-pink-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-pink-900">Create HerSpace Event</h4>
                                <input type="text" placeholder="Circle Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <input type="text" placeholder="Schedule / Date" value={date} onChange={e => setDate(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="url" placeholder="Meeting Link / URL" value={link} onChange={e => setLink(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-pink-600 text-white p-2 rounded-lg text-xs font-bold">Publish Circle</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {circles.map(c => (
                                <div key={c.id} className="p-3 bg-pink-50/50 rounded-xl border border-pink-200 flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-pink-950">{c.title}</p>
                                        <p className="text-pink-600 text-[10px]">{c.date}</p>
                                    </div>
                                    <a href={c.link} target="_blank" rel="noreferrer" className="text-pink-600 font-bold underline">Join</a>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 4. FIND SUPPORT MODULE
        const SupportScreen = ({ onBack, user }) => {
            const [contacts, setContacts] = useState([
                { id: 1, name: 'UNIOSUN Counseling Unit Hotline', phone: '+234 800 000 0000', hours: 'Mon–Fri, 8 AM – 4 PM' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [hours, setHours] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!name) return;
                setContacts([{ id: Date.now(), name, phone: phone || 'N/A', hours: hours || '24/7' }, ...contacts]);
                setName(''); setPhone(''); setHours(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Find Support 🤝</h3>
                                <p className="text-xs text-slate-500">Verified campus hotlines & counseling units.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-teal-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Add Contact</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-teal-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-teal-900">Add Support Hotline</h4>
                                <input type="text" placeholder="Service / Unit Name" value={name} onChange={e => setName(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <input type="text" placeholder="Phone Number / Contact" value={phone} onChange={e => setPhone(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="text" placeholder="Available Hours" value={hours} onChange={e => setHours(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-teal-700 text-white p-2 rounded-lg text-xs font-bold">Save Hotline</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {contacts.map(item => (
                                <div key={item.id} className="p-3 bg-teal-50/60 rounded-xl border border-teal-200">
                                    <p className="font-bold text-teal-900">{item.name}</p>
                                    <p className="text-slate-600 text-[11px] mt-0.5">📞 {item.phone}</p>
                                    <p className="text-teal-700 text-[10px] mt-0.5">🕒 {item.hours}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 5. GROWTH & OPPORTUNITIES MODULE
        const GrowthScreen = ({ onBack, user }) => {
            const [opps, setOpps] = useState([
                { id: 1, title: 'Tech Internship Cohort 2027', deadline: 'Feb 28, 2027', link: 'https://example.com/apply' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [title, setTitle] = useState('');
            const [deadline, setDeadline] = useState('');
            const [link, setLink] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!title) return;
                setOpps([{ id: Date.now(), title, deadline: deadline || 'Open', link: link || '#' }, ...opps]);
                setTitle(''); setDeadline(''); setLink(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Growth & Opportunities 🚀</h3>
                                <p className="text-xs text-slate-500">Scholarships, internships, and fellowships.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-amber-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Post Opportunity</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-amber-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-amber-900">Post New Opportunity</h4>
                                <input type="text" placeholder="Opportunity Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <input type="text" placeholder="Deadline (e.g. Feb 2027)" value={deadline} onChange={e => setDeadline(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="url" placeholder="Application Link / URL" value={link} onChange={e => setLink(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-amber-600 text-white p-2 rounded-lg text-xs font-bold">Publish Opportunity</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {opps.map(o => (
                                <div key={o.id} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-slate-800">{o.title}</p>
                                        <p className="text-amber-700 text-[10px]">Deadline: {o.deadline}</p>
                                    </div>
                                    <a href={o.link} target="_blank" rel="noreferrer" className="text-amber-600 font-bold underline">Apply</a>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 6. EVENTS & WEBINARS MODULE
        const EventsScreen = ({ onBack, user }) => {
            const [events, setEvents] = useState([
                { id: 1, title: 'PHF Fresher Orientation 2.0', date: 'Nov 20, 2026', link: 'https://example.com/event' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [title, setTitle] = useState('');
            const [date, setDate] = useState('');
            const [link, setLink] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!title) return;
                setEvents([{ id: Date.now(), title, date: date || 'Coming Soon', link: link || '#' }, ...events]);
                setTitle(''); setDate(''); setLink(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Events & Webinars 📅</h3>
                                <p className="text-xs text-slate-500">Workshops, orientation sessions & masterclasses.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Create Event</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-indigo-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-indigo-900">Schedule New Event</h4>
                                <input type="text" placeholder="Event Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <input type="text" placeholder="Date & Time" value={date} onChange={e => setDate(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="url" placeholder="Registration / Join Link" value={link} onChange={e => setLink(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-indigo-600 text-white p-2 rounded-lg text-xs font-bold">Publish Event</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {events.map(ev => (
                                <div key={ev.id} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-slate-800">{ev.title}</p>
                                        <p className="text-indigo-600 text-[10px]">{ev.date}</p>
                                    </div>
                                    <a href={ev.link} target="_blank" rel="noreferrer" className="text-indigo-600 font-bold underline">Register</a>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 7. CAMPUS CONNECT MODULE
        const CampusConnectScreen = ({ onBack, user }) => {
            const [announcements, setAnnouncements] = useState([
                { id: 1, title: 'PHF SafeSpace Campus Ambassador Launch', desc: 'Join our student team across UNIOSUN campuses.' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [title, setTitle] = useState('');
            const [desc, setDesc] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!title) return;
                setAnnouncements([{ id: Date.now(), title, desc: desc || 'UNIOSUN Update' }, ...announcements]);
                setTitle(''); setDesc(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Campus Connect 🏛️</h3>
                                <p className="text-xs text-slate-500">Announcements across UNIOSUN campuses.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-blue-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Post Announcement</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-blue-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-blue-900">New Campus Announcement</h4>
                                <input type="text" placeholder="Announcement Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <textarea placeholder="Details / Description" value={desc} onChange={e => setDesc(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" rows="2"></textarea>
                                <button type="submit" className="w-full bg-blue-600 text-white p-2 rounded-lg text-xs font-bold">Broadcast</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {announcements.map(a => (
                                <div key={a.id} className="p-3 bg-blue-50/50 rounded-xl border border-blue-200">
                                    <p className="font-bold text-blue-900">{a.title}</p>
                                    <p className="text-slate-600 text-[11px] mt-1">{a.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 8. RESOURCE LIBRARY MODULE
        const ResourcesScreen = ({ onBack, user }) => {
            const [resources, setResources] = useState([
                { id: 1, title: 'Semester Development Workbook 2.0', fileType: 'PDF', link: 'https://example.com/workbook.pdf' }
            ]);
            const [showForm, setShowForm] = useState(false);
            const [title, setTitle] = useState('');
            const [fileType, setFileType] = useState('');
            const [link, setLink] = useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if(!title) return;
                setResources([{ id: Date.now(), title, fileType: fileType || 'PDF', link: link || '#' }, ...resources]);
                setTitle(''); setFileType(''); setLink(''); setShowForm(false);
            };

            return (
                <div className="space-y-3">
                    <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>
                    <div className="bg-white p-4 rounded-2xl border shadow-sm space-y-3">
                        <div className="flex justify-between items-center">
                            <div>
                                <h3 className="font-bold text-sm text-slate-800">Resource Library 📚</h3>
                                <p className="text-xs text-slate-500">Downloadable semester workbooks and toolkits.</p>
                            </div>
                            {user.role === 'admin' && (
                                <button onClick={() => setShowForm(!showForm)} className="bg-violet-600 text-white px-3 py-1.5 rounded-xl text-[10px] font-bold">+ Upload File</button>
                            )}
                        </div>
                        {showForm && (
                            <form onSubmit={handleAdd} className="bg-violet-50 p-3 rounded-xl border space-y-2">
                                <h4 className="font-bold text-xs text-violet-900">Upload Toolkit / Workbook</h4>
                                <input type="text" placeholder="Resource Title" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" required />
                                <input type="text" placeholder="File Type (e.g. PDF, DOCX)" value={fileType} onChange={e => setFileType(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <input type="url" placeholder="Download Link / URL" value={link} onChange={e => setLink(e.target.value)} className="w-full p-2 bg-white rounded-lg border text-xs" />
                                <button type="submit" className="w-full bg-violet-600 text-white p-2 rounded-lg text-xs font-bold">Upload to Library</button>
                            </form>
                        )}
                        <div className="space-y-2 text-xs">
                            {resources.map(res => (
                                <div key={res.id} className="p-3 bg-violet-50/50 rounded-xl border border-violet-200 flex justify-between items-center">
                                    <div>
                                        <p className="font-bold text-violet-950">{res.title}</p>
                                        <p className="text-violet-600 text-[10px]">{res.fileType} • Ready for download</p>
                                    </div>
                                    <a href={res.link} target="_blank" rel="noreferrer" className="bg-violet-600 text-white px-3 py-1.5 rounded-xl font-bold">Download</a>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileScreen = ({ user, onBack }) => {
            const { logout } = useContext(AuthContext);
            const [showAdmin, setShowAdmin] = useState(false);
            const isAdmin = user.role === 'admin';

            return (
                <div className="space-y-3">
                    {onBack && <button onClick={onBack} className="text-xs font-bold text-emerald-700 flex items-center space-x-1 mb-1"><span>← Back to Home</span></button>}
                    <div className="bg-white p-4 rounded-2xl border text-center shadow-sm">
                        <div className="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center text-xl font-bold mx-auto mb-2 border-2 border-emerald-500">
                            {(user.full_name || user.email).charAt(0).toUpperCase()}
                        </div>
                        <h3 className="font-bold text-base text-slate-800">{user.full_name || 'Student'}</h3>
                        <p className="text-xs text-slate-400">{user.email}</p>
                        <span className="inline-block mt-2 text-[10px] bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">{user.role}</span>
                    </div>

                    {isAdmin && (
                        <button onClick={() => setShowAdmin(!showAdmin)} className="w-full bg-[#0b4638] text-white p-3 rounded-2xl text-xs font-bold shadow-sm">
                            {showAdmin ? 'Close Admin Control Panel' : 'Open Admin Control Panel'}
                        </button>
                    )}

                    {showAdmin && (
                        <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl space-y-2">
                            <h4 className="font-bold text-xs text-emerald-900">PHF Admin Management Tools</h4>
                            <p className="text-[11px] text-emerald-700">Both registered admin emails have active publishing and upload permissions across all modules!</p>
                        </div>
                    )}

                    <button onClick={logout} className="w-full bg-red-50 text-red-600 p-3 rounded-2xl text-xs font-bold border hover:bg-red-100 transition">
                        Logout of SafeSpace
                    </button>
                </div>
            );
        };

        ReactDOM.render(
            <AuthProvider>
                <App />
            </AuthProvider>,
            document.getElementById('root')
        );
    </script>
</body>
</html>
